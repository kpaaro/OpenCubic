name: Build

on:
  push:
    branches: [ "**" ]   # tags go through release.yml
    paths: [ "flashtool/**", "ci/**", ".github/workflows/build.yml" ]
  pull_request:
    paths: [ "flashtool/**", "ci/**", ".github/workflows/build.yml" ]
  workflow_dispatch:
  workflow_call:   # used by release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            dockerfile: ci/Dockerfile.debian
          - distro: ubuntu
            dockerfile: ci/Dockerfile.ubuntu
          - distro: arch
            dockerfile: ci/Dockerfile.arch
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # Image layers (apt/pacman installs) cached across runs
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: aceflash-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      # CLI + GUI build, unit tests, offscreen + Xvfb GUI checks
      - name: Build and test
        run: |
          mkdir -p shots
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/shots:/shots" \
            aceflash-${{ matrix.distro }}:ci /src/ci/gui-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.distro }}
          path: shots/
          if-no-files-found: ignore

      # Release binaries for testers. Built on Ubuntu 24.04 (oldest Qt here, 6.4) so they
      # run on newer distros too; need the system Qt 6 + OpenSSL packages.
      - name: Release binaries
        if: matrix.distro == 'ubuntu'
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" aceflash-ubuntu:ci bash -c '
            cp -r /src/flashtool /w &&
            cmake -S /w -B /b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBUILD_TESTING=OFF &&
            ninja -C /b aceflash AceFlashTool &&
            strip /b/aceflash /b/AceFlashTool &&
            tar -C /b -czf /out/aceflash-linux-x86_64.tar.gz aceflash AceFlashTool &&
            chown -R '"$(id -u):$(id -g)"' /out'

      - uses: actions/upload-artifact@v4
        if: matrix.distro == 'ubuntu'
        with:
          name: aceflash-linux-x86_64
          path: dist/aceflash-linux-x86_64.tar.gz

  # Upstream's release target: Qt 5.15.2 + MSVC, CLI + GUI, unit tests (no hardware)
  # Upstream's release toolchain: Qt 5.15.2 + MSVC, CLI + GUI, unit tests (no hardware).
  # A Qt 6.8 Windows package (OpenSSL 3) is in progress; Qt's repo no longer ships the
  # OpenSSL 1.1 DLLs Qt 5.15 needs, so this job does not package.
  windows:
    name: windows (Qt 5.15.2 MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          arch: win64_msvc2019_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S flashtool -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 120
