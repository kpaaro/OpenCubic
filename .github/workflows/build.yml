name: Build

on:
  push:
    branches: [ "**" ]   # tags go through release.yml
    paths: [ "flashtool/**", "ci/**", ".github/workflows/build.yml" ]
  pull_request:
    paths: [ "flashtool/**", "ci/**", ".github/workflows/build.yml" ]
  workflow_dispatch:
  workflow_call:   # used by release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            dockerfile: ci/Dockerfile.debian
          - distro: ubuntu
            dockerfile: ci/Dockerfile.ubuntu
          - distro: arch
            dockerfile: ci/Dockerfile.arch
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # Image layers (apt/pacman installs) cached across runs
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: aceflash-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      # CLI + GUI build, unit tests, offscreen + Xvfb GUI checks
      - name: Build and test
        run: |
          mkdir -p shots
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/shots:/shots" \
            aceflash-${{ matrix.distro }}:ci /src/ci/gui-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.distro }}
          path: shots/
          if-no-files-found: ignore

      # Release binaries for testers. Built on Ubuntu 24.04 (oldest Qt here, 6.4) so they
      # run on newer distros too; need the system Qt 6 + OpenSSL packages.
      - name: Release binaries
        if: matrix.distro == 'ubuntu'
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" aceflash-ubuntu:ci bash -c '
            cp -r /src/flashtool /w &&
            cmake -S /w -B /b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBUILD_TESTING=OFF &&
            ninja -C /b aceflash AceFlashTool &&
            strip /b/aceflash /b/AceFlashTool &&
            tar -C /b -czf /out/aceflash-linux-x86_64.tar.gz aceflash AceFlashTool &&
            chown -R '"$(id -u):$(id -g)"' /out'

      - uses: actions/upload-artifact@v4
        if: matrix.distro == 'ubuntu'
        with:
          name: aceflash-linux-x86_64
          path: dist/aceflash-linux-x86_64.tar.gz

  # Upstream's release target: Qt 5.15.2 + MSVC, CLI + GUI, unit tests (no hardware)
  # 5.15.2 = upstream's release toolchain (build + tests).
  # 6.8 = the downloadable build: Qt's repo only carries OpenSSL 3 now, which Qt 5.15
  #       cannot load; Qt 6 + OpenSSL 3 is the TLS stack tested on hardware under Linux.
  windows:
    name: windows (Qt ${{ matrix.qt }} MSVC)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: "5.15.2"
            arch: win64_msvc2019_64
            package: false
          - qt: "6.8.3"
            arch: win64_msvc2022_64
            tools: "tools_opensslv3_x64,qt.tools.opensslv3.win_x64"
            package: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          tools: ${{ matrix.tools }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S flashtool -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          # offscreen looks for fonts in <Qt>/lib/fonts (Qt no longer ships any)
          QT_QPA_FONTDIR: C:\Windows\Fonts
          # Windows Qt logs to the debugger channel otherwise -> empty CI log
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir build --output-on-failure --timeout 120

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-build-qt${{ matrix.qt }}
          path: build/

      # Portable folder: both exes, Qt runtime (windeployqt), OpenSSL 3 + Qt's OpenSSL TLS
      # backend (same TLS stack as the Linux build), VC++ runtime DLLs. qmqtt is static.
      - name: Package
        if: matrix.package
        run: |
          $dist = "dist/AceFlashTool"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/AceFlashTool.exe, build/aceflash.exe $dist
          windeployqt --dir $dist --no-translations --no-opengl-sw --no-system-d3d-compiler `
            --no-system-dxc-compiler --no-compiler-runtime "$dist/AceFlashTool.exe" "$dist/aceflash.exe"
          Remove-Item -Recurse -Force "$dist/imageformats" -ErrorAction SilentlyContinue
          Copy-Item "$env:QT_ROOT_DIR/plugins/tls/qopensslbackend.dll" "$dist/tls/"
          foreach ($d in "libssl-3-x64.dll", "libcrypto-3-x64.dll") {
            $src = Get-ChildItem $env:IQTA_TOOLS -Recurse -Filter $d | Select-Object -First 1
            if (-not $src) { throw "$d not found under $env:IQTA_TOOLS" }
            Copy-Item $src.FullName $dist
          }
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)/vcruntime140.dll", "$($crt.FullName)/vcruntime140_1.dll", "$($crt.FullName)/msvcp140.dll" $dist
          foreach ($f in "Qt6Network.dll", "platforms/qwindows.dll", "tls/qopensslbackend.dll", "vcruntime140.dll") {
            if (-not (Test-Path "$dist/$f")) { throw "$f missing from package" }
          }
          # Smoke test of the packaged CLI with only the package on PATH
          $env:PATH = "$((Resolve-Path $dist).Path);C:\Windows\System32"
          $ver = & "$dist/aceflash.exe" --version
          if ($LASTEXITCODE) { throw "packaged aceflash.exe failed: $LASTEXITCODE" }
          if ("$ver" -notmatch '^aceflash \d') { throw "aceflash.exe --version printed '$ver'" }
          $ver
          Get-ChildItem $dist -Recurse -File | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName.Substring((Resolve-Path $dist).Path.Length + 1) }

      - uses: actions/upload-artifact@v4
        if: matrix.package
        with:
          name: aceflash-windows-x64
          path: dist/

  # Community-supported build (not part of the release assets): proves the macOS
  # backends (CommonCrypto, app bundle, ad-hoc signing) still build and pass the tests.
  macos:
    name: macos (Qt 6.8 arm64)
    runs-on: macos-15
    # Community-supported: report, never block release.yml's publish (needs: build)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Configure
        run: cmake -S flashtool -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: /System/Library/Fonts
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Check bundle and signature
        run: |
          app=build/AceFlashTool.app
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" | grep -q com.apple.security.network.server
          # CommonCrypto backend: no OpenSSL linked in
          ! otool -L "$app/Contents/MacOS/AceFlashTool" build/aceflash | grep -i -E 'libssl|libcrypto'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-build-macos
          path: build/

      # Self-contained .app with the CLI next to the GUI binary, re-signed ad-hoc after
      # macdeployqt rewrote the load paths. Downloaded copies need
      # `xattr -dr com.apple.quarantine AceFlashTool.app` (not notarised).
      - name: Package
        run: |
          mkdir -p dist
          cp -R build/AceFlashTool.app dist/
          cp build/aceflash dist/AceFlashTool.app/Contents/MacOS/
          macdeployqt dist/AceFlashTool.app -executable=dist/AceFlashTool.app/Contents/MacOS/aceflash
          ls dist/AceFlashTool.app/Contents/PlugIns/tls/
          codesign --force --deep --sign - --timestamp=none \
            --entitlements flashtool/macos/AceFlashTool.entitlements dist/AceFlashTool.app
          codesign --verify --strict dist/AceFlashTool.app
          ver=$(env -i dist/AceFlashTool.app/Contents/MacOS/aceflash --version)
          [[ "$ver" =~ ^aceflash\ [0-9] ]] || { echo "aceflash --version printed '$ver'"; exit 1; }
          echo "$ver"
          (cd dist && ditto -c -k --keepParent AceFlashTool.app aceflash-macos-arm64.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/aceflash-macos-arm64.zip
