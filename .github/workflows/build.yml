name: Build

on:
  push:
    branches: [ "**" ]   # tags go through release.yml
    paths: [ "flashtool/**", "ci/**", ".github/workflows/build.yml" ]
  pull_request:
    paths: [ "flashtool/**", "ci/**", ".github/workflows/build.yml" ]
  workflow_dispatch:
  workflow_call:   # used by release.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            dockerfile: ci/Dockerfile.debian
          - distro: ubuntu
            dockerfile: ci/Dockerfile.ubuntu
          - distro: arch
            dockerfile: ci/Dockerfile.arch
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # Image layers (apt/pacman installs) cached across runs
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: aceflash-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}

      # CLI + GUI build, unit tests, offscreen + Xvfb GUI checks
      - name: Build and test
        run: |
          mkdir -p shots
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/shots:/shots" \
            aceflash-${{ matrix.distro }}:ci /src/ci/gui-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.distro }}
          path: shots/
          if-no-files-found: ignore

      # Release binaries for testers. Built on Ubuntu 24.04 (oldest Qt here, 6.4) so they
      # run on newer distros too; need the system Qt 6 + OpenSSL packages.
      - name: Release binaries
        if: matrix.distro == 'ubuntu'
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" aceflash-ubuntu:ci bash -c '
            cp -r /src/flashtool /w &&
            cmake -S /w -B /b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DBUILD_TESTING=OFF &&
            ninja -C /b aceflash AceFlashTool &&
            strip /b/aceflash /b/AceFlashTool &&
            tar -C /b -czf /out/aceflash-linux-x86_64.tar.gz aceflash AceFlashTool &&
            chown -R '"$(id -u):$(id -g)"' /out'

      - uses: actions/upload-artifact@v4
        if: matrix.distro == 'ubuntu'
        with:
          name: aceflash-linux-x86_64
          path: dist/aceflash-linux-x86_64.tar.gz

  # Upstream's release target: Qt 5.15.2 + MSVC, CLI + GUI, unit tests (no hardware)
  # 5.15.2 = upstream's release toolchain (build + tests).
  # 6.8 = the downloadable build: Qt's repo only carries OpenSSL 3 now, which Qt 5.15
  #       cannot load; Qt 6 + OpenSSL 3 is the TLS stack tested on hardware under Linux.
  windows:
    name: windows (Qt ${{ matrix.qt }} MSVC)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: "5.15.2"
            arch: win64_msvc2019_64
            package: false
          - qt: "6.8.3"
            arch: win64_msvc2022_64
            tools: "tools_opensslv3_x64,qt.tools.opensslv3.win_x64"
            package: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          tools: ${{ matrix.tools }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S flashtool -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      # Portable folder: both exes, Qt runtime (windeployqt), qmqtt and OpenSSL 3 DLLs
      - name: Package
        if: matrix.package
        run: |
          $dist = "dist/AceFlashTool"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/AceFlashTool.exe, build/aceflash.exe $dist
          windeployqt --dir $dist --no-translations --no-opengl-sw --no-system-d3d-compiler `
            "$dist/AceFlashTool.exe" "$dist/aceflash.exe"
          Get-ChildItem build -Recurse -Filter *.dll |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' -and -not (Test-Path "$dist/$($_.Name)") } |
            Copy-Item -Destination $dist
          Remove-Item -Recurse -Force "$dist/imageformats" -ErrorAction SilentlyContinue
          foreach ($d in "libssl-3-x64.dll", "libcrypto-3-x64.dll") {
            $src = Get-ChildItem $env:IQTA_TOOLS -Recurse -Filter $d | Select-Object -First 1
            if (-not $src) { throw "$d not found under $env:IQTA_TOOLS" }
            Copy-Item $src.FullName $dist
          }
          if (-not (Test-Path "$dist/tls")) { throw "Qt TLS plugins missing from package" }
          Get-ChildItem $dist -Recurse | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        if: matrix.package
        with:
          name: aceflash-windows-x64
          path: dist/
